# Cloudflare Worker 設定：一個部署就包埋網站同 AI
name = "wangri-lvtu"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"

# 後備設定：同 wrangler.toml 一樣，但冇 [placement]。
# 只會喺帳戶唔支援 placement 設定、部署失敗時先用（deploy-windows.bat 會自動試）。

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
