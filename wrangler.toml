# Cloudflare Pages 設定：網站 + AI（/api/*）一齊部署，網址 https://trails-of-the-past.pages.dev
# 打包：npm run build:pages（網站去 dist/，AI 伺服器程式複製去 dist/_worker.js/）
name = "trails-of-the-past"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
DEEPSEEK_MODEL = "deepseek-chat"
# AI 開關：已開。有 GEMINI_API_KEY 就用 Gemini；出錯時用 Cloudflare Workers AI 嘅 Llama 3.3 70B（免費，唔使金鑰）做後備。
# 想改用其他 AI：喺 Cloudflare Pages 專案（Settings → Variables and Secrets）加 Secret GEMINI_API_KEY 或者 DEEPSEEK_API_KEY 就會優先用；
# 出錯時自動轉用 Workers AI；全部用唔到就將長者講過嘅說話按次序排好，遊戲照常運作。想完全關閉 AI，改做 "false"。
AI_ENABLED = "true"

# Cloudflare Workers AI（免費）
[ai]
binding = "AI"
