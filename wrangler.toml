# Cloudflare Worker 設定：一個部署就包埋網站同 AI
name = "wangri-lvtu-hk"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
DEEPSEEK_MODEL = "deepseek-chat"
# AI 開關：已開。只要喺 Cloudflare（Settings → Variables and Secrets）加一個 Secret 就會用 AI 整理故事：
#   DEEPSEEK_API_KEY（建議，香港可以直接用）或者 GEMINI_API_KEY（Gemini 唔接受香港連線，要另外設定美國伺服器）
# 冇金鑰時遊戲照常運作，故事會改為將長者講過嘅說話按次序排好。想完全關閉 AI，改做 "false"。
AI_ENABLED = "true"

[observability]
enabled = false
